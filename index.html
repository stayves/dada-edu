<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DaDa.Edu: Қазақстанның әр қаласындағы 5–11 сыныптарға арналған олимпиадалар, үйірмелер, тілдер және жазғы мектептер.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DaDa.Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: playful hero with grade picker → grid of bright category tiles → the chosen category unfolds below as a full catalogue with filters. */
:root{
  --bg:#EFF7FB;
  --surface:#FFFFFF;
  --ink:#0F2A3B;
  --muted:#52707F;
  --line:#D5E7EF;
  --soft:#E4F1F7;
  --violet:#0A7FA3;
  --art-op:.30;
  --on-violet:#FFFFFF;
  --c-olymp:#4457F5;  --t-olymp:#FFFFFF;
  --c-math:#0A7FC9;   --t-math:#FFFFFF;
  --c-lang:#EE4F78;   --t-lang:#FFFFFF;
  --c-code:#5DB83A;   --t-code:#0F2600;
  --c-sci:#FF8540;    --t-sci:#2B1300;
  --c-club:#FEC50C;   --t-club:#2B2000;
  --c-summer:#12B3C9; --t-summer:#02292F;
  --c-exam:#0D7468;   --t-exam:#FFFFFF;
  --c-city:#0F2A3B;   --t-city:#FFFFFF;
  --ok:#0E9F6E; --soon:#E08600;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1823;--surface:#122536;--ink:#E9F5FA;--muted:#9BB6C4;--line:#21405A;--soft:#193247;--art-op:.22;--on-violet:#062430;
    --violet:#4CC4E4;--c-olymp:#5D6EFF;--c-exam:#14958A;--c-city:#E9F5FA;--t-city:#0F2A3B;--ok:#34D399;--soon:#FFB347;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1823;--surface:#122536;--ink:#E9F5FA;--muted:#9BB6C4;--line:#21405A;--soft:#193247;--art-op:.22;--on-violet:#062430;
  --violet:#4CC4E4;--c-olymp:#5D6EFF;--c-exam:#14958A;--c-city:#E9F5FA;--t-city:#0F2A3B;--ok:#34D399;--soon:#FFB347;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:clamp(16px,4vw,44px);padding-block:20px 60px}
.wrap{max-width:1200px;margin-inline:auto;display:flex;flex-direction:column;gap:34px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--violet);font-weight:700}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
button{font:inherit;color:inherit}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .dots{display:inline-grid;grid-template-columns:repeat(2,9px);gap:3px}
.logo .dots i{width:9px;height:9px;border-radius:50%;display:block}
.logo b{color:var(--violet)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;min-width:0;flex:0 1 320px}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);outline:none;width:100%;min-width:0}
.search:focus-within{border-color:var(--violet)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--surface);border-radius:28px;padding:clamp(24px,5vw,52px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6.4vw,74px);line-height:.98;letter-spacing:-.035em}
.hero h1 .d1{color:var(--c-olymp)}.hero h1 .d2{color:var(--c-lang)}.hero h1 .dot{color:var(--c-club)}.hero h1 .e{color:var(--c-code)}
.hero p{margin:14px 0 0;font-size:18px;color:var(--muted);max-width:44ch}
.shapes{position:absolute;inset:0;pointer-events:none;z-index:0}
.shapes i{position:absolute;display:block;border-radius:50%;opacity:.9}
.hero > *:not(.shapes){position:relative;z-index:1}
.grade-card{background:var(--soft);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.grade-card .lbl{font-weight:800;font-size:15px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gbtn{cursor:pointer;border:2px solid transparent;background:var(--surface);border-radius:14px;padding:10px 0;font-family:var(--f-display);font-weight:800;font-size:20px;transition:transform .12s}
.gbtn small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--muted)}
.gbtn:hover{transform:translateY(-2px)}
.gbtn[aria-pressed="true"]{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}
.gbtn[aria-pressed="true"] small{color:var(--on-violet)}
.grade-card .hint{font-size:13px;color:var(--muted);margin:0}

/* categories */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
.sec-h span{color:var(--muted);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{cursor:pointer;text-align:left;border:0;border-radius:22px;padding:18px 18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--cc);color:var(--ct);position:relative;overflow:hidden;transition:transform .15s, box-shadow .15s}
.cat:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 10px 24px -12px var(--cc)}
.cat .glyph{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;opacity:.95}
.cat .name{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.cat .count{font-size:13px;font-weight:700;opacity:.85}
.cat::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:currentColor;opacity:.1}
.cat[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}

/* detail */
.detail{background:var(--surface);border-radius:28px;overflow:hidden;scroll-margin-top:16px}
.dhead{background:var(--cc);color:var(--ct);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:10px}
.dhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,42px);letter-spacing:-.03em}
.dhead p{margin:0;max-width:64ch;font-size:16.5px;opacity:.95}
.dfilters{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{cursor:pointer;border:2px solid currentColor;background:transparent;border-radius:999px;padding:4px 13px;font-size:14px;font-weight:700;color:var(--ct)}
.chip[aria-pressed="true"]{background:var(--ct);color:var(--cc)}
.dbody{padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:16px}
.summary{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px;color:var(--muted);font-weight:700}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.items{grid-template-columns:1fr}}
.item{border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{font-size:18px;font-weight:800;line-height:1.25}
.item .org{font-size:13.5px;color:var(--muted);font-weight:600}
.status{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.status.now{background:var(--ok);color:#fff}
.status.soon{background:var(--soon);color:#241300}
.gstrip{display:flex;flex-direction:column;gap:4px}
.gstrip .row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.gstrip .row i{height:22px;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.gstrip .row i.in{background:var(--cc);color:var(--ct)}
.gstrip .row i.me{box-shadow:inset 0 0 0 2px var(--ink)}
.gstrip .cap{font-size:12.5px;font-weight:700;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12.5px;font-weight:700;background:var(--soft);border-radius:8px;padding:3px 9px}
.item p{margin:0;font-size:15px}
.item .how{font-size:14.5px;color:var(--muted)}
.item .how b{color:var(--ink)}
.item .src{font-size:14px;margin-top:auto}
.empty{padding:30px 0;text-align:center;color:var(--muted);font-weight:700}
/* location */
.loc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.loc{grid-template-columns:1fr}}
.loc select{font:inherit;font-weight:700;font-size:14.5px;color:var(--ink);background:var(--surface);border:2px solid transparent;border-radius:12px;padding:9px 10px;width:100%;min-width:0}
.loc select:focus{border-color:var(--violet)}
.cat.city{grid-column:span 2;min-height:150px}
.cat.city .name{font-size:clamp(18px,2.4vw,24px)}
.cat.city .pins{display:flex;gap:5px}
.cat.city .pins i{width:10px;height:10px;border-radius:50%;display:block}
@media (max-width:900px){.cat.city{grid-column:1/-1}}
.where{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;border-radius:10px;padding:6px 10px;background:var(--soft);color:var(--muted)}
.where svg{flex:none}
.where.here{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.where.near{background:color-mix(in srgb,var(--soon) 18%,transparent);color:var(--ink)}
.status.sure{background:var(--ok);color:#fff}
.status.usual{background:var(--soon);color:#241300}
.status.far{background:var(--soft);color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--violet)}
.hidden-note{font-size:14px;color:var(--muted);font-weight:700}
.hidden-note button{cursor:pointer;background:none;border:0;color:var(--violet);font-weight:800;text-decoration:underline;padding:0}
footer{font-size:13px;color:var(--muted);max-width:80ch}
/* background art: hand-drawn school doodles + Kazakh ornament, fixed behind everything */
body{background:
  radial-gradient(60vmax 40vmax at 100% 0%,color-mix(in srgb,var(--c-club) 16%,transparent),transparent 70%),
  radial-gradient(50vmax 40vmax at 0% 100%,color-mix(in srgb,var(--c-summer) 16%,transparent),transparent 70%),
  var(--bg);background-attachment:fixed}
.bgart{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--art-op)}
.bgart svg{width:100%;height:100%;display:block}
.bgart g{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bgart text{font-family:var(--f-display);font-weight:800;stroke:none}
.bgart .fl{animation:float 9s ease-in-out infinite alternate}
.bgart .fl2{animation:float 12s ease-in-out infinite alternate-reverse}
@keyframes float{to{transform:translateY(-14px)}}
.wrap{position:relative;z-index:1}
.hero{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hero .art{position:absolute;pointer-events:none;opacity:.22}
.hero .art g{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:820px){.hero .art.a2{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<style>
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:0 1 auto;min-width:0}
.langs{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px}
.langs button{cursor:pointer;border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
</style>
<div class="bgart" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <path id="spark" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12Z"/>

    </g>
    <!-- atom -->
    <g class="fl2" stroke="var(--c-summer)" transform="translate(1330 150)">
      <ellipse rx="56" ry="20"/><ellipse rx="56" ry="20" transform="rotate(60)"/><ellipse rx="56" ry="20" transform="rotate(120)"/>
      <circle r="7" fill="var(--c-summer)"/>

      <path d="M-15 4 L-30 28 L-15 22 M15 4 L30 28 L15 22 M-7 30 Q0 48 7 30"/>

    <g class="fl2" stroke="var(--c-math)" transform="translate(230 400)">

    <text x="380" y="110" font-size="46" fill="var(--c-math)" transform="rotate(-10 380 110)">π</text>

    <text x="780" y="60" font-size="34" fill="var(--c-code)" transform="rotate(12 780 60)">ABC</text>
    <!-- Kazakh ornament (қошқар мүйіз) -->
    <g stroke="var(--c-club)" transform="translate(1390 40) rotate(200) scale(1.3)"><use href="#horn"/></g>
    <g stroke="var(--c-summer)" transform="translate(40 30) rotate(160) scale(1.1)"><use href="#horn"/></g>

    <g stroke="var(--c-olymp)" transform="translate(300 770) rotate(-15) scale(.8)"><use href="#horn"/></g>
    <!-- sparkles & dots -->
    <g stroke="none">
      <use href="#spark" fill="var(--c-club)" transform="translate(470 230)"/>
      <use href="#spark" fill="var(--c-lang)" transform="translate(1200 260) scale(.8)"/>

    <path d="M520 800 q20 -18 40 0 t40 0 t40 0" stroke="var(--c-summer)" stroke-width="3" fill="none" stroke-linecap="round"/>

</div>
<div class="wrap">
  <div class="bar">
    <div class="logo" aria-label="DaDa.Edu">
      <span class="dots" aria-hidden="true"><i style="background:var(--c-olymp)"></i><i style="background:var(--c-lang)"></i><i style="background:var(--c-club)"></i><i style="background:var(--c-code)"></i></span>
      DaDa<b>.Edu</b>
    </div>
    <div class="right">
      <div class="langs" role="group" aria-label="Тіл / Язык">
        <button type="button" id="lang-kk" data-l="kk">Қаз</button>
        <button type="button" id="lang-ru" data-l="ru">Рус</button>
      </div>
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" autocomplete="off">
      </label>
    </div>
  </div>

  <section class="hero">
    <div class="shapes" aria-hidden="true">
      <i style="width:120px;height:120px;right:-30px;top:-40px;background:var(--c-club)"></i>
      <i style="width:46px;height:46px;right:36%;bottom:-18px;background:var(--c-lang)"></i>
      <i style="width:18px;height:18px;left:46%;top:22px;background:var(--c-code)"></i>
      <svg class="art" width="150" height="110" viewBox="-75 -55 150 110" style="left:30%;bottom:6px"><g stroke="var(--c-summer)"><path d="M-70 50 L-30 -10 L-8 20 L20 -30 L70 50 Z M20 -30 L8 -8 L20 -14 L32 -8 Z"/></g></svg>
      <svg class="art a2" width="120" height="120" viewBox="-60 -60 120 120" style="left:54%;top:14px"><g stroke="var(--c-club)"><circle r="18"/><path d="M0 -30 V-46 M0 30 V46 M-30 0 H-46 M30 0 H46 M-21 -21 L-32 -32 M21 21 L32 32 M-21 21 L-32 32 M21 -21 L32 -32"/></g></svg>
    </div>
    <div>
      <h1><span class="d1">Da</span><span class="d2">Da</span><span class="dot">.</span><span class="e">Edu</span></h1>
      <p id="tagline"></p>
    </div>
    <div class="grade-card">
      <div class="lbl" id="lblLive"></div>

        <select id="regionSel"></select>
        <select id="placeSel"></select>

      <div class="lbl" id="lblGrade"></div>
      <div class="grades" id="grades" role="group"></div>
      <p class="hint" id="gradeHint"></p>

  <section style="display:flex;flex-direction:column;gap:16px">

  <section class="detail" id="detail" aria-live="polite"></section>

  <footer id="footer"></footer>
</div>

function km(a,b){
  const t=Math.PI/180, dLat=(b.lat-a.lat)*t, dLon=(b.lon-a.lon)*t;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)**2;
  return Math.round(12742*Math.asin(Math.sqrt(h)));
}
function nearest(from, pred){
  let best=null, d=Infinity;
  for (const p of PLACES){ if (p.k==="village"||!pred(p)) continue; const x=km(from,p); if (x<d){d=x;best=p;} }
  return best && {p:best, d};
}

}

function whereInfo(it, pl){
  const w = it.w, N = pname(pl);
  if (w==="o") return {cls:"here",label:tr("Онлайн, доступно из любого места","Онлайн, кез келген жерден қолжетімді"),ok:true};
  if (w==="s") return {cls:"here",label:tr("Через твою школу","Мектебің арқылы"),ok:true};
  if (w==="a") return {cls:"",label:tr("Заявка онлайн, программа за рубежом","Өтінім онлайн, бағдарлама шетелде"),ok:true};
  if (w==="c") return pl.k==="village" ? {cls:"near",label:tr("Обычно есть в районном центре","Әдетте аудан орталығында бар"),ok:true}
                                       : {cls:"here",label:tr(`Обычно есть в городе ${N}, уточни адрес`,`Әдетте ${N} қаласында бар, мекенжайын нақтыла`),ok:true};
  const hereFn = w==="r" ? p=>p.k==="rep"||p.k==="center" : w==="nis" ? p=>p.nis : p=>w.cities.includes(p.id);
  if (pl.k!=="village" && hereFn(pl)) return {cls:"here",label:tr(`Есть в городе ${N}`,`${N} қаласында бар`),ok:true};
  const n = nearest(pl, hereFn);
  const also = typeof w==="object" && w.on ? tr(" · есть онлайн"," · онлайн бар") : "";
  return {cls:n.d<=200?"near":"", label:tr(`Ближайшее: ${pname(n.p)}, ~${n.d} км`,`Ең жақыны: ${pname(n.p)}, ~${n.d} км`)+also, ok:n.d<=200||!!also};
}

function status(it){
  if (it.m.length===12) return {k:"now",label:tr("Круглый год","Жыл бойы"),d:0};
  if (it.m.includes(NOW)) return {k:"now",label:tr("Идёт сейчас","Қазір өтіп жатыр"),d:0};
  let d = 1; while (!it.m.includes(((NOW-1+d)%12)+1)) d++;
  return {k:d<=2?"soon":"",label:d===1?tr("В следующем месяце","Келесі айда"):tr(`Через ${d} ${plural(d,["месяц","месяца","месяцев"])}`,`${d} айдан кейін`),d};
}

  document.getElementById("regionSel").setAttribute("aria-label", tr("Область","Облыс"));
  document.getElementById("placeSel").setAttribute("aria-label", tr("Город или село","Қала немесе ауыл"));
  document.getElementById("grades").setAttribute("aria-label", tr("Класс","Сынып"));
  for (const l of ["kk","ru"]) document.getElementById("lang-"+l).setAttribute("aria-pressed", state.lang===l);
}
function renderLocation(){
  const rs = document.getElementById("regionSel"), ps = document.getElementById("placeSel"), pl = place();
  rs.innerHTML = REGIONS.map(r=>`<option value="${r.id}">${esc(rname(r))}</option>`).join("");
  rs.value = pl.r;
  const list = PLACES.filter(p=>p.r===pl.r);
  ps.innerHTML = list.map(p=>`<option value="${p.id}">${esc(pname(p))}${p.k==="center"?" "+ui("center"):""}</option>`).join("");
  ps.value = pl.id; ps.disabled = list.length===1;
}
function renderGrades(){
  document.getElementById("grades").innerHTML = [0,5,6,7,8,9,10,11].map(g=>`<button type="button" class="gbtn" id="grade-${g}" data-g="${g}" aria-pressed="${state.grade===g}">${g||ui("all")}<small>${g?ui("cls"):ui("clsPl")}</small></button>`).join("");
  const pl = place(), N = pname(pl);
  const n = ITEMS.filter(i=>fitsGrade(i) && whereInfo(i,pl).ok).length + localItems(pl).filter(i=>!i.net).length;
  const who = state.grade ? tr(`Для ${state.grade} класса`,`${state.grade}-сынып үшін`) : tr("Для всех классов","Барлық сыныптар үшін");
  const where = pl.k==="village" ? tr("в твоём районе","ауданыңда") : tr(`в городе ${N}`,`${N} қаласында`);
  document.getElementById("gradeHint").textContent = tr(`${who} ${where} доступно ${n}${nWord(n,["вариант","варианта","вариантов"])}.`,`${who} ${where} ${n} мүмкіндік бар.`);
}
function renderCats(){
  const pl = place();
  document.getElementById("cats").innerHTML = CATS.map(c=>{
    const pressed = state.cat===c.id && !state.q;
    if (c.id==="city"){
      const n = localItems(pl).length;
      const title = pl.k==="village" ? tr("В моём селе и районе","Менің ауылым мен ауданымда") : tr(`В моём городе: ${pname(pl)}`,`Менің қаламда: ${pname(pl)}`);
      return `<button type="button" class="cat city" id="cat-city" data-c="city" style="${colorVars("city")}" aria-pressed="${pressed}">
        <span class="pins" aria-hidden="true"><i style="background:var(--c-olymp)"></i><i style="background:var(--c-lang)"></i><i style="background:var(--c-club)"></i><i style="background:var(--c-code)"></i><i style="background:var(--c-summer)"></i></span>
        <span><span class="name">${esc(title)}</span><br><span class="count">${tr(`${n} ${plural(n,["возможность","возможности","возможностей"])} рядом: школы, вузы, кружки, олимпиады`,`Жақын жерде ${n} мүмкіндік: мектептер, ЖОО, үйірмелер, олимпиадалар`)}</span></span>
      </button>`;
    }
    const n = ITEMS.filter(i=>i.c===c.id && fitsGrade(i) && (!state.mine || whereInfo(i,pl).ok)).length;
    return `<button type="button" class="cat" id="cat-${c.id}" data-c="${c.id}" style="${colorVars(c.id)}" aria-pressed="${pressed}">
      <span class="glyph" aria-hidden="true">${c.glyph}</span>
      <span><span class="name">${catName(c)}</span><br><span class="count">${tr(`${n} ${plural(n,["вариант","варианта","вариантов"])}`,`${n} мүмкіндік`)}${state.grade?tr(` для ${state.grade} кл.`,` · ${state.grade}-сынып`):""}</span></span>
    </button>`;
  }).join("");
}
function card(raw, catId){
  const it = L(raw), pl = place();
  const st = it.conf ? {k:it.conf,label:CONF[it.conf][KZ()?1:0]} : status(it);
  const wi = it.c==="city" ? null : whereInfo(raw,pl);
  const cells = [5,6,7,8,9,10,11].map(g=>`<i class="${g>=it.g[0]&&g<=it.g[1]?"in":""} ${g===state.grade?"me":""}">${g}</i>`).join("");
  const gtxt = it.g[0]===it.g[1] ? tr(`Только ${it.g[0]} класс`,`Тек ${it.g[0]}-сынып`) : tr(`С ${it.g[0]} по ${it.g[1]} класс`,`${it.g[0]}–${it.g[1]} сыныптар`);
  const facts = it.conf && !it.net ? [it.d] : [it.d, monthsText(it.m), it.f, it.p];
  return `<article class="item" style="${colorVars(catId||it.c)}">
    <div class="item-top">
      <div><h3>${esc(it.t)}</h3><div class="org">${esc(it.o)}</div></div>
      <span class="status ${st.k}">${st.label}</span>
    </div>
    ${wi?`<div class="where ${wi.cls}">${PIN}${esc(wi.label)}</div>`:""}
    <div class="gstrip"><div class="row" aria-hidden="true">${cells}</div><span class="cap">${gtxt}</span></div>
    <div class="facts">${facts.filter(Boolean).map(f=>`<span class="fact">${esc(f)}</span>`).join("")}</div>
    <p>${esc(it.x)}</p>
    <p class="how"><b>${ui("howStart")}</b> ${esc(it.h)}</p>
    ${it.u?`<div class="src"><a href="https://${esc(it.u)}" target="_blank" rel="noopener">${esc(it.u)} ↗</a></div>`:""}
  </article>`;
}
function chips(dirs){
  return `<div class="dfilters" role="group" aria-label="${tr("Направление","Бағыт")}">
    ${["all",...dirs].map(d=>`<button type="button" class="chip" data-d="${esc(d)}" aria-pressed="${state.dir===d}">${d==="all"?ui("allDirs"):esc(KZ()?v(d):d)}</button>`).join("")}</div>`;
}
function renderDetail(){
  const el = document.getElementById("detail"), pl = place(), N = pname(pl);
  if (state.q){
    const q = state.q.toLowerCase();
    const res = [...localItems(pl).filter(i=>!i.net), ...ITEMS].filter(i=>{ const l = L(i); return fitsGrade(i) && [l.t,l.o,l.d,l.x,i.t].join(" ").toLowerCase().includes(q); });
    el.setAttribute("style","--cc:var(--violet);--ct:var(--on-violet)");
    el.innerHTML = `<div class="dhead"><h2>${tr("Поиск","Іздеу")}: «${esc(state.q)}»</h2><p>${tr(`${res.length} ${plural(res.length,["результат","результата","результатов"])} во всех категориях`,`Барлық санаттарда ${res.length} нәтиже`)}${state.grade?tr(` для ${state.grade} класса`,` (${state.grade}-сынып)`):""}.</p></div>
      <div class="dbody">${res.length?`<div class="items">${res.map(i=>card(i)).join("")}</div>`:`<div class="empty">${tr("Ничего не нашлось. Попробуй другое слово или выбери «Все» классы.","Ештеңе табылмады. Басқа сөзбен іздеп көр немесе «Барлығы» сыныптарын таңда.")}</div>`}</div>`;
    return;
  }
  const c = CATS.find(x=>x.id===state.cat);
  if (c.id==="city"){
    const R = REGIONS.find(r=>r.id===pl.r), C = P(R.center);
    const all = localItems(pl);
    const dirs = [...new Set(all.map(i=>i.d))];
    if (state.dir!=="all" && !dirs.includes(state.dir)) state.dir = "all";
    const order = {sure:0,usual:1,far:2};
    const list = all.filter(i=>state.dir==="all"||i.d===state.dir).sort((a,b)=>order[a.conf]-order[b.conf]);
    const dist = pl.k==="rep" ? "" : tr(` · областной центр: ${pname(C)}${pl.id!==C.id?`, ~${km(pl,C)} км`:""}`,` · облыс орталығы: ${pname(C)}${pl.id!==C.id?`, ~${km(pl,C)} км`:""}`);
    el.setAttribute("style", colorVars("city"));
    el.innerHTML = `<div class="dhead">
        <h2>${pl.k==="village"?tr("Твоё село и район","Сенің ауылың мен ауданың"):esc(N)}</h2>
        <p>${esc(rname(R))}${dist}. ${tr("Здесь всё, что есть рядом с тобой: школы, вузы, кружки, сети вроде American Corner и KIBERone, этапы олимпиад и идея проекта, которая есть только в твоём регионе.","Мұнда жаныңдағының бәрі бар: мектептер, ЖОО, үйірмелер, American Corner және KIBERone сияқты желілер, олимпиада кезеңдері және тек сенің өңіріңе тән жоба идеясы.")}</p>
        ${chips(dirs)}
      </div>
      <div class="dbody">
        <div class="summary">
          <span>${CONF.sure[KZ()?1:0]}: <b>${all.filter(i=>i.conf==="sure").length}</b></span>
          <span>${CONF.usual[KZ()?1:0]}: <b>${all.filter(i=>i.conf==="usual").length}</b></span>
          <span>${tr("Онлайн из каталога","Каталогтағы онлайн")}: <b>${ITEMS.filter(i=>i.w==="o"&&fitsGrade(i)).length}</b></span>
        </div>
        <div class="items">${list.map(i=>card(i,"city")).join("")}</div>
      </div>`;
    return;
  }
  const all = ITEMS.filter(i=>i.c===c.id);
  const dirs = [...new Set(all.map(i=>i.d))];
  if (state.dir!=="all" && !dirs.includes(state.dir)) state.dir = "all";
  const base = all.filter(i=>fitsGrade(i) && (state.dir==="all"||i.d===state.dir));
  const list = base.filter(i=>!state.mine || whereInfo(i,pl).ok).sort((a,b)=>status(a).d-status(b).d || a.g[0]-b.g[0]);
  const hidden = base.length - list.length;
  const hereN = list.filter(i=>whereInfo(i,pl).cls==="here").length;
  el.setAttribute("style", colorVars(c.id));
  el.innerHTML = `<div class="dhead">
      <h2>${catName(c)}</h2>
      <p>${catDesc(c)}</p>
      ${chips(dirs)}
    </div>
    <div class="dbody">
      <div class="summary">
        <span>${tr("Показано","Көрсетілді")}: <b>${list.length}</b></span>
        <span>${pl.k==="village"?tr("Доступно из села или онлайн","Ауылдан немесе онлайн қолжетімді"):tr(`Доступно в городе ${N} или онлайн`,`${N} қаласында немесе онлайн қолжетімді`)}: <b>${hereN}</b></span>
        <span>${tr("Идёт сейчас","Қазір өтіп жатыр")}: <b>${list.filter(i=>status(i).d===0).length}</b></span>
        <span>${tr("Бесплатно","Тегін")}: <b>${list.filter(i=>/бесплатно/i.test(i.p)).length}</b></span>
      </div>
      <label class="toggle" for="mine"><input type="checkbox" id="mine" ${state.mine?"checked":""}> ${ui("onlyMine")}</label>
      ${hidden?`<div class="hidden-note">${tr(`Ещё ${hidden} ${plural(hidden,["вариант","варианта","вариантов"])} только в других городах дальше 200 км.`,`Тағы ${hidden} мүмкіндік тек 200 км-ден алыс басқа қалаларда.`)} <button type="button" id="showAll">${ui("show")}</button></div>`:""}
      ${list.length?`<div class="items">${list.map(i=>card(i,c.id)).join("")}</div>`:`<div class="empty">${tr("Здесь пока ничего не подходит. Выбери другой класс или направление.","Мұнда әзірге ештеңе сәйкес келмейді. Басқа сынып немесе бағыт таңда.")}</div>`}
    </div>`;
}
function renderAll(){ renderStatic(); renderLocation(); renderGrades(); renderCats(); renderDetail(); }

// ── events
const pickPlace = id => { state.place = id; SS("dada.place", id); state.cat = "city"; state.dir = "all"; renderAll(); };
document.getElementById("regionSel").addEventListener("change", e=> pickPlace(REGIONS.find(r=>r.id===e.target.value).center));
document.getElementById("placeSel").addEventListener("change", e=> pickPlace(e.target.value));
document.querySelector(".langs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.lang = b.dataset.l; SS("dada.lang", state.lang); state.dir = "all"; renderAll();
});
document.getElementById("grades").addEventListener("click", e=>{
  const b = e.target.closest(".gbtn"); if(!b) return;
  state.grade = +b.dataset.g; SS("dada.grade", state.grade); renderGrades(); renderCats(); renderDetail();
});
document.getElementById("cats").addEventListener("click", e=>{
  const b = e.target.closest(".cat"); if(!b) return;
  state.cat = b.dataset.c; state.dir = "all"; state.q = ""; document.getElementById("q").value = "";
  renderCats(); renderDetail();
  document.getElementById("detail").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
});
document.getElementById("detail").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if (b){ state.dir = b.dataset.d; renderDetail(); return; }
  if (e.target.id==="showAll"){ state.mine = false; renderCats(); renderDetail(); }
});
document.getElementById("detail").addEventListener("change", e=>{
  if (e.target.id==="mine"){ state.mine = e.target.checked; renderCats(); renderDetail(); }
});
document.getElementById("q").addEventListener("input", e=>{ state.q = e.target.value.trim(); renderCats(); renderDetail(); });

if (![0,5,6,7,8,9,10,11].includes(state.grade)) state.grade = 0;
renderAll();
</script>

</body>
</html>
